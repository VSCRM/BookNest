		<!-- ─── Security headers ──────────────────────────────────── -->
		<!--
      CSP notes:
        • 'unsafe-eval' is required by Zod (zod.js uses Function() internally
          for regex compilation).  Remove once Zod ships a CSP-safe build.
        • 'unsafe-inline' is required by the inline SPA redirect script.

          spec) so a same-origin blob: worker — e.g. from a future feature,
          or one a browser extension tries to inject — has somewhere
          defined to land rather than silently inheriting whatever
          script-src happens to allow.

          it is silently ignored inside a <meta> tag per the CSP spec.
          Set  X-Frame-Options: DENY  and
          Content-Security-Policy: frame-ancestors 'none'  on the server.
    -->
		<meta

        default-src 'self';
        script-src  'self' 'unsafe-inline' 'unsafe-eval';
        worker-src  'self' blob:;

        font-src    'self' https://fonts.gstatic.com;
